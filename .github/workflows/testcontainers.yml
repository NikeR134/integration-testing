name: Testcontainers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package application
        run: mvn -B clean package -DskipTests
      - name: Build development image
        run: docker build --build-arg APP_PORT=8080 --build-arg NETOLOGY_PROFILE_DEV=true -t devapp .
      - name: Build production image
        run: docker build --build-arg APP_PORT=8081 --build-arg NETOLOGY_PROFILE_DEV=false -t prodapp .
      - name: Run integration tests
        run: mvn -B test
